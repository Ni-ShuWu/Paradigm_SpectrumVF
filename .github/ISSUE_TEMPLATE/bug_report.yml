name: 问题反馈
description: 报告制谱器中的错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
      placeholder: 打开谱面后点击“放置音符”，时间轴没有反应……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 程序版本或提交哈希
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建曲包……
        2. 点击……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或截图
      description: 可选，粘贴报错文本或拖入图片。
